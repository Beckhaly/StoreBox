services:

  postgres:
    image: postgres:16-alpine
    container_name: storebox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       storebox_ci
      POSTGRES_USER:     storebox
      POSTGRES_PASSWORD: TelePro2026!
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../apps/api/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../apps/api/migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ../apps/api/migrations/003_auth.sql:/docker-entrypoint-initdb.d/03_auth.sql:ro
      - ../apps/api/migrations/004_notifications.sql:/docker-entrypoint-initdb.d/04_notifications.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U storebox -d storebox_ci"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [storebox-net]

  api:
    image: node:20-alpine
    container_name: storebox-api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --silent && npx tsx src/index.ts"
    volumes:
      - ../apps/api:/app
      - /app/node_modules
    environment:
      DATABASE_URL:       postgresql://storebox:TelePro2026!@postgres:5432/storebox_ci
      PORT:               "3001"
      FRONTEND_URL:       http://localhost
      NODE_ENV:           production
      JWT_SECRET:         ${JWT_SECRET:-storebox-change-this-secret-in-production-64chars}
      JWT_EXPIRES:        8h
      SMS_PROVIDER:       ${SMS_PROVIDER:-twilio}
      WA_PROVIDER:        ${WA_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM:        ${TWILIO_FROM:-}
      TWILIO_WA_FROM:     ${TWILIO_WA_FROM:-whatsapp:+14155238886}
      GERANT_TEL:         ${GERANT_TEL:-+22507000000}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]
    networks: [storebox-net]
    profiles: ["docker-only"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:20-alpine
    container_name: storebox-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --silent && npm run build && npx serve dist -p 3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks: [storebox-net]
    profiles: ["docker-only"]

  nginx:
    image: nginx:alpine
    container_name: storebox-nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [storebox-net]
    profiles: ["docker-only"]

volumes:
  postgres_data:
    name: storebox_postgres_data

networks:
  storebox-net:
    name: storebox-network
    driver: bridge

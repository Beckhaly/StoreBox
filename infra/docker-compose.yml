# ═══════════════════════════════════════════════════════════════════
# StoreBox — Conteneurisation (image unique API+SPA + Postgres)
# Profils :
#   prod  → docker compose --profile prod up -d --build   (image immuable)
#   dev   → docker compose --profile dev  up               (hot-reload)
# La base Postgres tourne dans les deux profils.
# Variables : voir infra/.env (copier depuis infra/.env.example)
# ═══════════════════════════════════════════════════════════════════

services:

  # ── Base de données (commune aux deux profils) ──────────────────
  db:
    image: postgres:16-alpine
    container_name: storebox-db
    restart: unless-stopped
    # Base externe : uniquement pour les profils split (prod/dev).
    # Le profil "solo" embarque sa propre base dans le conteneur unique.
    profiles: ["prod", "dev"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-storebox_ci}
      POSTGRES_USER:     ${POSTGRES_USER:-storebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storebox}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Port hôte configurable (5434 par défaut pour éviter tout conflit)
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storebox} -d ${POSTGRES_DB:-storebox_ci}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [storebox-net]

  # ── Application (PROD) : image build, Express sert API + SPA ─────
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    image: storebox-app:latest
    container_name: storebox-app
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-storebox}:${POSTGRES_PASSWORD:-storebox}@db:5432/${POSTGRES_DB:-storebox_ci}
      PORT:         "3001"
      NODE_ENV:     production
      JWT_SECRET:   ${JWT_SECRET:?Definir JWT_SECRET dans infra/.env}
      JWT_EXPIRES:  ${JWT_EXPIRES:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      WA_PROVIDER:  ${WA_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM:        ${TWILIO_FROM:-}
      TWILIO_WA_FROM:     ${TWILIO_WA_FROM:-whatsapp:+14155238886}
      GERANT_TEL:         ${GERANT_TEL:-+22507000000}
    ports:
      - "${APP_PORT:-8080}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks: [storebox-net]

  # ── Application (DEV) : hot-reload (tsx + Vite) ──────────────────
  app-dev:
    image: node:20-slim
    container_name: storebox-app-dev
    profiles: ["dev"]
    working_dir: /app
    command: >
      sh -c "npm ci &&
             node scripts/run-migrations.mjs &&
             npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-storebox}:${POSTGRES_PASSWORD:-storebox}@db:5432/${POSTGRES_DB:-storebox_ci}
      PORT:         "5000"
      NODE_ENV:     development
      JWT_SECRET:   ${JWT_SECRET:-dev-secret-not-for-production-padded-to-64-chars-xxxxxxxxxxxxx}
      JWT_EXPIRES:  8h
    volumes:
      - ..:/app                 # code source (hot-reload)
      - /app/node_modules       # node_modules isolé (binaires Linux)
    ports:
      - "${WEB_PORT:-3005}:3000" # Vite
      - "${API_PORT:-5005}:5000" # API
    depends_on:
      db:
        condition: service_healthy
    networks: [storebox-net]

  # ── TOUT-EN-UN : PostgreSQL + API + SPA dans un seul conteneur ───
  storebox:
    build:
      context: ..
      dockerfile: Dockerfile.allinone
    image: storebox-allinone:latest
    container_name: storebox-solo
    profiles: ["solo"]
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-storebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storebox}
      POSTGRES_DB:       ${POSTGRES_DB:-storebox_ci}
      PGDATA:            /var/lib/postgresql/data/pgdata
      PORT:              "3001"
      JWT_SECRET:        ${JWT_SECRET:?Definir JWT_SECRET dans infra/.env}
      JWT_EXPIRES:       ${JWT_EXPIRES:-8h}
      FRONTEND_URL:      ${FRONTEND_URL:-http://localhost:8080}
      SMS_PROVIDER:      ${SMS_PROVIDER:-twilio}
      WA_PROVIDER:       ${WA_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM:        ${TWILIO_FROM:-}
      TWILIO_WA_FROM:     ${TWILIO_WA_FROM:-whatsapp:+14155238886}
      GERANT_TEL:         ${GERANT_TEL:-+22507000000}
    ports:
      - "${APP_PORT:-8080}:3001"
    volumes:
      - solo_data:/var/lib/postgresql/data
    networks: [storebox-net]

volumes:
  db_data:
    name: storebox_db_data
  solo_data:
    name: storebox_solo_data

networks:
  storebox-net:
    name: storebox-network
    driver: bridge

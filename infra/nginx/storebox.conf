## StoreBox — Nginx config pour VPS
## Copier dans /etc/nginx/sites-available/storebox
## ln -s /etc/nginx/sites-available/storebox /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;            # Remplacer par le domaine : storebox.example.com

    # Frontend — fichiers statiques Vite
    root /var/www/storebox/apps/web/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache assets statiques (JS, CSS, images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API — proxy vers Node.js (PM2)
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Taille max upload (PDF, imports)
        client_max_body_size 10M;
    }

    # SPA fallback — toutes les routes non-fichier vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Securite basique
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ═══════════════════════════════════════════════════════════════════
# StoreBox — Déploiement VPS (production)
#   Conteneur tout-en-un (Postgres + API + SPA) + Caddy (HTTPS auto).
#   Seul Caddy est exposé sur Internet (80/443) ; l'app reste interne.
#
#   Usage :
#     cp infra/.env.example infra/.env   # renseigner JWT_SECRET, POSTGRES_PASSWORD, CADDY_DOMAIN
#     docker compose -f infra/docker-compose.vps.yml up -d --build
# ═══════════════════════════════════════════════════════════════════

services:

  storebox:
    build:
      context: ..
      dockerfile: Dockerfile.allinone
    image: storebox-allinone:latest
    container_name: storebox-solo
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-storebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-storebox_ci}
      PGDATA:            /var/lib/postgresql/data/pgdata
      PORT:              "3001"
      JWT_SECRET:        ${JWT_SECRET:?Definir JWT_SECRET}
      JWT_EXPIRES:       ${JWT_EXPIRES:-8h}
      FRONTEND_URL:      https://${CADDY_DOMAIN}
      SMS_PROVIDER:      ${SMS_PROVIDER:-twilio}
      WA_PROVIDER:       ${WA_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM:        ${TWILIO_FROM:-}
      TWILIO_WA_FROM:     ${TWILIO_WA_FROM:-whatsapp:+14155238886}
      GERANT_TEL:         ${GERANT_TEL:-+22507000000}
    volumes:
      - solo_data:/var/lib/postgresql/data
    expose:
      - "3001"            # interne uniquement (joignable par Caddy via le réseau)
    networks: [storebox-net]

  caddy:
    image: caddy:2-alpine
    container_name: storebox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: "${CADDY_DOMAIN:?Definir CADDY_DOMAIN dans infra/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storebox
    networks: [storebox-net]

volumes:
  solo_data:
    name: storebox_solo_data
  caddy_data:
  caddy_config:

networks:
  storebox-net:
    name: storebox-network
    driver: bridge
